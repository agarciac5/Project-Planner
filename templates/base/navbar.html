<header class="topbar">
    <div class="brand-block">
        <div class="brand-mark">UNI</div>
        <div>
            <p class="eyebrow">UNIMINUTO</p>
            <h1 class="brand-title">Planeador académico</h1>
        </div>
    </div>

    <nav class="main-nav">
        <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Inicio</a>
        <a href="{% url 'calendar' %}" class="{% if request.resolver_match.url_name == 'calendar' %}active{% endif %}">Calendario</a>
        <a href="{% url 'add_calendar' %}" class="{% if request.resolver_match.url_name == 'add_calendar' %}active{% endif %}">Generar horario</a>
        <a href="{% url 'subjects' %}" class="{% if request.resolver_match.url_name == 'subjects' or request.resolver_match.url_name == 'create_subject' %}active{% endif %}">Materias</a>
        <a href="{% url 'teacher_list' %}" class="{% if request.resolver_match.url_name == 'teacher_list' %}active{% endif %}">Docentes</a>
        <a href="{% url 'students' %}" class="{% if request.resolver_match.url_name == 'students' %}active{% endif %}">Estudiantes</a>
        <a href="{% url 'programs' %}" class="{% if request.resolver_match.url_name == 'programs' %}active{% endif %}">Programas</a>
        <a href="{% url 'study_plan' %}" class="{% if request.resolver_match.url_name == 'study_plan' %}active{% endif %}">Plan de estudios</a>
        <a href="{% url 'faculties' %}" class="{% if request.resolver_match.url_name == 'faculties' %}active{% endif %}">Facultades</a>
        <a href="{% url 'campuses' %}" class="{% if request.resolver_match.url_name == 'campuses' %}active{% endif %}">Sedes</a>
        <a href="{% url 'classrooms' %}" class="{% if request.resolver_match.url_name == 'classrooms' %}active{% endif %}">Aulas</a>
        <a href="{% url 'import' %}" class="{% if request.resolver_match.url_name == 'import' %}active{% endif %}">Importar</a>
    </nav>

    <div class="toolbar-actions">
        <a class="icon-pill {% if request.resolver_match.url_name == 'settings' %}active{% endif %}" href="{% url 'settings' %}">Ajustes</a>
        <a class="icon-pill {% if request.resolver_match.url_name == 'profile' %}active{% endif %}" href="{% url 'profile' %}">Perfil</a>
    </div>
</header>
