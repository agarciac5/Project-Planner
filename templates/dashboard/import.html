{% extends 'base/base.html' %}
{% block title %}Importar | ITM Planner{% endblock %}
{% block content %}
<section class="page-header">
    <div>
        <p class="eyebrow">Importar</p>
        <h2>Cargar documentos</h2>
    </div>
</section>

<section class="card import-card">
    <div class="form-grid two">
        <label class="field">
            <span>Tipo de archivo</span>
            <select>
                <option>PDF (.pdf)</option>
                <option>Word (.doc, .docx)</option>
                <option>Excel (.xls, .xlsx)</option>
                <option>PowerPoint (.ppt, .pptx)</option>
                <option>Imagen JPG (.jpg, .jpeg)</option>
                <option>Imagen PNG (.png)</option>
                <option>Texto (.txt)</option>
                <option>CSV (.csv)</option>
                <option>ZIP/RAR (.zip, .rar)</option>
            </select>
        </label>
        <label class="field">
            <span>Archivo</span>
            <input type="file">
        </label>
    </div>
    <button class="btn btn-primary">Importar documentos</button>
</section>
{% endblock %}
