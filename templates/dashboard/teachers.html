{% extends 'base/base.html' %}
{% block title %}Docentes | ITM Planner{% endblock %}
{% block content %}
<section class="page-header">
    <div>
        <p class="eyebrow">Docentes</p>
        <h2>Listado general</h2>
    </div>
</section>

<section class="card table-card">
    <div class="table-responsive">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Docente</th>
                    <th>Cédula</th>
                    <th>Nivel de inglés</th>
                    <th>Materia</th>
                    <th>Código</th>
                </tr>
            </thead>
            <tbody>
                {% for item in teachers %}
                <tr>
                    <td>{{ item.0 }}</td>
                    <td>{{ item.1 }}</td>
                    <td>{{ item.2 }}</td>
                    <td>{{ item.3 }}</td>
                    <td>{{ item.4 }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>
{% endblock %}
